[package]
name = "celldiff"
version = "0.5.0"
edition = "2024"
description = "Compare CSV cells and report differences as XLSX or plain text"

[dependencies]
encoding_rs = "0.8"
csv = "1.4"
similar = { version = "3.2", features = ["unicode"] }
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tempfile = "3"
same-file = "1"

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
